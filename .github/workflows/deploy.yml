name: Build and Deploy to App Store

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Set up App Store Connect API Key
        run: |
          mkdir -p ~/.private_keys
          cat << 'KEYEOF' > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEYEOF

      - name: Build IPA for App Store
        run: flutter build ipa --release --no-codesign

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app -t ios -f build/ios/archive/Runner.xcarchive --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
