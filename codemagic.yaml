workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppleKey
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: "ch.swisstheorie.bpt121"
    scripts:
      - name: Install dependencies
        script: |
          flutter packages get
      - name: Set up code signing
        script: |
          keychain initialize
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_key.pem
          keychain add-certificates
          xcode-project use-profiles
      - name: Build and Export IPA
        script: |
          # Tertemiz export options plist dosyamizi olusturuyoruz
          cat << PLIST > /tmp/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>4B79843375</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

          # Flutter dogrudan arşivi olusturup export islemini bu plist ile tamamlayacak
          flutter build ipa --release --no-pub --export-options-plist=/tmp/export_options.plist
          
          find build/ios/ipa -name "*.ipa" -exec cp {} ./Runner.ipa \;
          ls -lh Runner.ipa
      - name: Publish to App Store Connect
        script: |
          app-store-connect publish --path Runner.ipa
    artifacts:
      - Runner.ipa
