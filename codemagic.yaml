workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppleKey
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ch.swisstheorie.bpt121
      vars:
        BUNDLE_ID: "ch.swisstheorie.bpt121"
    scripts:
      - name: Install dependencies
        script: |
          flutter packages get
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
