workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppleKey
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch or create signing files from Apple
        script: |
          openssl genrsa -out /tmp/cert_key.pem 2048
          # JSON kullanmadan doğrudan parantez içindeki 10 haneli Sertifika ID'sini yakalayıp siliyoruz
          CERT_ID=$(app-store-connect list-certificates --type DISTRIBUTION | grep -Eo '\([A-Z0-9]{10}\)' | head -n 1 | tr -d '()')
          echo "Target Certificate ID to delete: $CERT_ID"
          if [ -n "$CERT_ID" ]; then
            app-store-connect delete-certificate "$CERT_ID"
          fi
          app-store-connect fetch-signing-files "ch.swisstheorie.bpt121" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_key.pem
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build ipa for distribution
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
