workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppleKey
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: "ch.swisstheorie.bpt121"
      cocoapods: default
    scripts:
      - name: Build ipa with automatic signing
        script: |
          flutter build ipa --release
      - name: Publish to App Store Connect
        script: |
          app-store-connect publish --path $(find build -name "*.ipa" | head -n 1)
    artifacts:
      - build/ios/ipa/*.ipa
