workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppleKey
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: "ch.swisstheorie.bpt121"
    scripts:
      - name: Install dependencies
        script: |
          flutter packages get
      - name: Set up code signing
        script: |
          keychain initialize
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_key.pem
          keychain add-certificates
          xcode-project use-profiles
      - name: Build and Export IPA
        script: |
          # Önce arşivi standart Flutter komutuyla oluştur
          flutter build ipa --release --no-pub
          
          # Oluşan arşivin yolunu tam olarak bul ve değişkene ata
          ARCHIVE_PATH=$(find build/ios/archive -name "*.xcarchive" | head -n 1)
          echo "Found archive at: $ARCHIVE_PATH"
          
          # IPA'ya dönüştür
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ios/ipa
            
          find build/ios/ipa -name "*.ipa" -exec cp {} ./Runner.ipa \;
          ls -lh Runner.ipa
      - name: Publish to App Store Connect
        script: |
          app-store-connect publish --path Runner.ipa
    artifacts:
      - Runner.ipa
