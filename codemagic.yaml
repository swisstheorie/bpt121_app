workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppleKey
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: "ch.swisstheorie.bpt121"
    scripts:
      - name: Install dependencies
        script: |
          flutter packages get
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          mkdir -p build/ios/ipa
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          # Flutter bazen build/ios/ipa altına bazen de build/ios/archive altına atar, bulup kopyalayalım:
          find build -name "*.ipa" -exec cp {} build/ios/ipa/ \;
          ls -la build/ios/ipa/
      - name: Publish to App Store Connect
        script: |
          app-store-connect publish --path build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
