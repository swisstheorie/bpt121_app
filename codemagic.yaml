workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppleKey
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: "ch.swisstheorie.bpt121"
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          # Keychain ve sertifika alani sifirdan duzgun kuruluyor
          keychain initialize
          
          # Apple Developer hesabindan sertifika ve profili otomatik indiriyoruz
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa
        script: |
          # Codemagic'in kendi urettigi export_options dosyasini kullanarak IPA uretiyoruz
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Publish to App Store Connect
        script: |
          app-store-connect publish --path "$(find build/ios/ipa -name "*.ipa" | head -n 1)"
    artifacts:
      - build/ios/ipa/*.ipa
