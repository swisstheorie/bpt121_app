workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppleKey
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: "ch.swisstheorie.bpt121"
    scripts:
      - name: Install dependencies
        script: |
          flutter packages get
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build and Export IPA
        script: |
          # Codemagic'in ürettiği export_options.plist içindeki array hatasını Python ile düzeltelim
          python3 -c '
          import plistlib
          path = "/Users/builder/export_options.plist"
          with open(path, "rb") as f:
              data = plistlib.load(f)
          print("Original export_options.plist:", data)
          if isinstance(data.get("provisioningProfiles"), list):
              fixed_profiles = {}
              for item in data["provisioningProfiles"]:
                  if isinstance(item, dict):
                      fixed_profiles.update(item)
              data["provisioningProfiles"] = fixed_profiles
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          print("Fixed export_options.plist:", data)
          '

          # Düzeltilmiş plist ile IPA oluştur
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

          # Oluşan IPA dosyasını ana dizine Runner.ipa olarak kopyala
          find build -name "*.ipa" -exec cp {} ./Runner.ipa \;
          ls -lh Runner.ipa
      - name: Publish to App Store Connect
        script: |
          app-store-connect publish --path Runner.ipa
    artifacts:
      - Runner.ipa
