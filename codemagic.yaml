workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppleKey
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: "ch.swisstheorie.bpt121"
    scripts:
      - name: Install dependencies
        script: |
          flutter packages get
      - name: Set up code signing
        script: |
          keychain initialize
          
          # Sertifika oluşturmak için gerekli RSA özel anahtarını üret
          openssl genrsa -out /tmp/cert_key.pem 2048
          
          # Bu anahtarı kullanarak Apple'dan sertifika ve profili çek/oluştur
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_key.pem
            
          keychain add-certificates
          xcode-project use-profiles
      - name: Build and Export IPA
        script: |
          # export_options.plist içeriğini kontrol et (Artık dolu olmalı!)
          cat /Users/builder/export_options.plist
          
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

          find build -name "*.ipa" -exec cp {} ./Runner.ipa \;
          ls -lh Runner.ipa
      - name: Publish to App Store Connect
        script: |
          app-store-connect publish --path Runner.ipa
    artifacts:
      - Runner.ipa
