workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppleKey
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch or create signing files from Apple
        script: |
          openssl genrsa -out /tmp/cert_key.pem 2048
          # Kalan tüm eski DISTRIBUTION sertifikalarını temizliyoruz ki 409 hatası tamamen kalksın
          app-store-connect certificates list --type DISTRIBUTION --json > /tmp/certs.json
          CERT_IDS=$(python3 -c '
          import json, re
          content = open("/tmp/certs.json").read()
          match = re.search(r"\[\s*\{.*\}\s*\]", content, re.DOTALL)
          if match:
              for cert in json.loads(match.group(0)):
                  print(cert["id"])
          ')
          for ID in $CERT_IDS; do
            echo "Deleting Certificate ID: $ID"
            app-store-connect certificates delete "$ID" || true
          done
          app-store-connect fetch-signing-files "ch.swisstheorie.bpt121" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_key.pem
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build ipa for distribution
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
